name: Deploy account deletion
on:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: chase-account-deletion-deploy
  cancel-in-progress: false
jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm test
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x
      - name: Check Edge runtime
        run: |
          deno check supabase/functions/delete-account/index.ts
          deno test --no-remote supabase/tests/account_deletion_test.ts
      - name: Install isolated PostgreSQL test engine
        run: npm install --prefix "$RUNNER_TEMP/chase-sql-tools" --no-package-lock --no-audit --no-fund --ignore-scripts @electric-sql/pglite@0.3.15
      - name: Validate deletion permissions and account cascade
        run: CHASE_PGLITE_MODULE="$RUNNER_TEMP/chase-sql-tools/node_modules/@electric-sql/pglite/dist/index.js" npm run test:account-deletion-sql
      - name: Apply additive deletion migration
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: node scripts/configure-account-deletion.mjs
      - uses: supabase/setup-cli@v1
        with:
          version: latest
      - name: Deploy authenticated deletion endpoint
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: supabase functions deploy delete-account --project-ref vzjekkgyrdxzlhaupnrw --use-api
